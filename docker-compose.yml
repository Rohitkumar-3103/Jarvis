version: '3.8'

services:
  backend:
    build: .
    container_name: jarvis_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./config:/app/config
      - ./memory:/app/memory
    env_file:
      - .env
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000

  frontend:
    image: nginx:alpine
    container_name: jarvis_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
